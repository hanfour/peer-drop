name = "peerdrop-signal"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# Account ID is not a secret (it's semi-public and derivable from any
# dashboard URL). Committing it lets `wrangler deploy` resolve the account
# in CI without the CLOUDFLARE_ACCOUNT_ID GitHub secret, which was empty
# and — together with the Node 20 pin (wrangler needs ≥22) — silently
# broke every auto-deploy since ~#40. Found 2026-07-05.
account_id = "22d9d417c1d3ab5d72aa9aedc0cc183c"

[vars]
# Set TURN_KEY_ID via `wrangler secret put TURN_KEY_ID`
# Set TURN_API_TOKEN via `wrangler secret put TURN_API_TOKEN`
# Set APNS_KEY_P8 via `cat AuthKey.p8 | wrangler secret put APNS_KEY_P8`
# Set APNS_KEY_ID via `wrangler secret put APNS_KEY_ID`
# Set APNS_TEAM_ID via `wrangler secret put APNS_TEAM_ID`
# Set APNS_BUNDLE_ID via `wrangler secret put APNS_BUNDLE_ID`
# Set ANALYTICS_KEY via `wrangler secret put ANALYTICS_KEY`

[[kv_namespaces]]
binding = "ROOMS"
id = "376d9f22d4c743bfb1509b814087192c"

[[kv_namespaces]]
binding = "V2_STORE"
id = "9968f53e396f441da9e9fa419285ed68"

[[kv_namespaces]]
binding = "METRICS"
id = "d49e0db6cc5b4dc3b17678937cb11233"

[[d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "peerdrop-accounts"
database_id = "8d39ccd9-a41f-40a2-85d4-a20bef410a9e"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[durable_objects.bindings]]
name = "PREKEY_STORE"
class_name = "PreKeyStore"

[[durable_objects.bindings]]
name = "DEVICE_INBOX"
class_name = "DeviceInbox"

[[durable_objects.bindings]]
name = "ACCOUNT_INBOX"
class_name = "AccountInbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PreKeyStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DeviceInbox"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["AccountInbox"]
