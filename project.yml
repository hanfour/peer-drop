name: PeerDrop
options:
  bundleIdPrefix: com.peerdrop
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  # WebRTC is not declared at the project level — it reaches the app
  # target transitively via PeerDropKit (PeerDropTransport). The pinned
  # version lives in PeerDropKit/Package.swift.
  PeerDropKit:
    path: PeerDropKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  PeerDrop:
    type: application
    platform: iOS
    sources:
      - path: PeerDrop
    dependencies:
      - package: PeerDropKit
        product: PeerDropPlatform
      - package: PeerDropKit
        product: PeerDropCore
      - package: PeerDropKit
        product: PeerDropTransport
      - package: PeerDropKit
        product: PeerDropSecurity
      - package: PeerDropKit
        product: PeerDropProtocol
    settings:
      base:
        INFOPLIST_FILE: PeerDrop/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hanfour.peerdrop
        DEVELOPMENT_TEAM: UK48R5KWLV
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "6.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PeerDrop/App/PeerDrop.entitlements
      configs:
        # Release builds ship WITHOUT the worker API key. Since the
        # 2026-07 rotation, X-API-Key is an operator/dev credential —
        # shipped binaries authenticate exclusively via App Attest
        # bearer tokens. Embedding the key in a store IPA is what made
        # the pre-rotation key extractable in the first place.
        # The empty define keeps $(PEERDROP_WORKER_API_KEY) resolvable
        # in Info.plist; Secrets.xcconfig is bound to Debug ONLY so no
        # future secret added there can silently reach a Release IPA.
        Release:
          PEERDROP_WORKER_API_KEY: ""
    configFiles:
      Debug: Secrets.xcconfig
    entitlements:
      path: PeerDrop/App/PeerDrop.entitlements
      properties:
        # APNs capability — Apple maps "development" → "production"
        # automatically at archive time based on the signing profile, so
        # one value works for both TestFlight/App Store and dev builds.
        # Without this key iOS calls didFailToRegisterForRemoteNotifications
        # and the app never gets a device token.
        aps-environment: development
        # Pivot 2026-09: app-group + iCloud entitlements are kept for ONE
        # release so LegacyPetDataCleanup can purge pet residue. Remove in
        # sub-project 1 (see docs/superpowers/specs/2026-09-14-notes-diary-pivot-design.md).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hanfour.peerdrop
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.hanfour.peerdrop
        com.apple.security.application-groups:
          - group.com.hanfour.peerdrop
        # Keychain access group: required for unit tests to use the
        # Security framework on simulator. Without this, every
        # `SecItemAdd` returns errSecMissingEntitlement (-34018) and
        # the IdentityKey / PreKey / ChatDataEncryptor / TrustedContact
        # test suites all fail by construction, taking ~16 dependent
        # tests with them. Single shared group; the team prefix
        # placeholder resolves at signing time.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hanfour.peerdrop
    info:
      path: PeerDrop/App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: PeerDrop
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - peerdrop
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "PeerDrop uses the local network to discover and connect to nearby devices for file transfer and voice calls."
        NSBonjourServices:
          - "_peerdrop._tcp"
        NSMicrophoneUsageDescription: "PeerDrop needs microphone access for voice calls."
        NSBluetoothAlwaysUsageDescription: "PeerDrop uses Bluetooth to discover nearby devices for file sharing."
        NSNearbyInteractionUsageDescription: "PeerDrop uses Nearby Interaction to measure the distance and direction of nearby devices for precise file sharing."
        NSCameraUsageDescription: "PeerDrop needs camera access to capture photos for sharing in chats."
        NSPhotoLibraryUsageDescription: "PeerDrop needs photo library access to share photos and videos in chats."
        PeerDropWorkerAPIKey: "$(PEERDROP_WORKER_API_KEY)"
        # Crypto-policy trust roots — DUAL-KEY OVERLAP (2026-07-05).
        # [0] PRODUCTION key: private half held OFFLINE (1Password), never
        #     in this repo. This is now the primary signing root.
        # [1] DEV key (cloudflare-worker/dev-signing-key.json): kept ONLY as
        #     an overlap so the dev-signed bundled default still verifies
        #     through the strict-policy soak (the worker keeps serving it
        #     until activation; a prod-only build would reject it and spike
        #     policy.signature_invalid across the fleet, poisoning the soak
        #     gate). Dropped in the follow-up release once strict is live —
        #     see docs/plans/2026-07-05-strict-policy-activation.md §A.
        # Residual risk while the dev key remains is bounded: merged() is
        # stronger-of-two, so a forged blob can only FORCE-STRICT
        # (availability), never weaken (confidentiality).
        CryptoPolicyPublicKeys:
          - 3aj4GxVAqGSm+alHJHLqNhqE0d9CHu4HPthmYHxJl+Y=
          - 2Mds2dPO3W7UYqwP32fiee4pIK2BPMzVxBfgAKT1nyk=
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - voip
          - bluetooth-central
          - bluetooth-peripheral
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown

  PeerDropMac:
    type: application
    platform: macOS
    sources:
      - path: PeerDropMac
        excludes:
          # Bundled README is documentation for developers / asset
          # commissioning, not for end users. Don't ship it.
          - "Resources/README.md"
      # Privacy Manifest — shared single source-of-truth with iOS so
      # both bundles declare the same NSPrivacyAccessedAPI reasons.
      # Notarization will reject Mac builds without this file.
      - path: PeerDrop/PrivacyInfo.xcprivacy
      # App icon catalog — universal idiom with 1024×1024 source.
      # Xcode derives Mac variants at build time. Without this the Mac
      # .app ships without Assets.car / AppIcon.icns and MAS submission
      # rejects "Missing required icon file".
      - path: PeerDrop/App/Assets.xcassets
      # Localizable.xcstrings — SwiftUI Text("…") resolves
      # cross-platform via this catalog. Without this the Mac bundle
      # has no .lproj directories and ships English-only.
      - path: PeerDrop/App/Localizable.xcstrings
      # Purchase/ — StoreKit Tip Jar manager. Cross-platform (no UIKit).
      # Required so MacSettingsView's Support tab can surface the IAPs
      # that M4 Task 10 attaches via Playwright.
      - path: PeerDrop/Purchase
      # Reuse cross-platform views from the iOS UI tree.
      # iOS-only files excluded per M2 Task 1 audit.
      - path: PeerDrop/UI
        excludes:
          # M3 un-excluded: Voice/** (gated via MacFeatureFlags) +
          # Settings/PushStatusRow (UIApplication → NSWorkspace gated).
          # M4 Task 1b un-excluded: UserProfileView / FilePickerView /
          # ConnectionQRView / RelayConnectView / MediaPreviewView /
          # ChatBubbleView / ChatView (all PlatformImage-refactored) +
          # NearbyTab + LibraryTab (chain deps now buildable).
          - "SettingsView.swift"                 # UIDevice — iOS-only; replaced by MacSettingsView
          - "Settings/DocumentPickerView.swift"  # iOS-only settings document picker; FilePickerView covers macOS needs
          - "Transfer/ClipboardShareView.swift"  # UIImage + UIPasteboard niche; not surfaced on macOS yet
          - "Chat/CameraPickerView.swift"        # UIImagePickerController — no macOS camera UI
          - "ContentView.swift"                  # iOS root TabView — replaced by MacContentView
          # Settings/TipJarSection.swift un-excluded for M4 — MacSettingsView
          # now has a Support tab so the Mac IAPs attached via Playwright
          # are reachable (Apple Guideline 2.1 risk otherwise).
          # iOS-shaped tab containers — replaced by MacContentView/MacDetailRouter:
          - "Connection/ConnectionView.swift"    # iOS tab container; macOS uses MacContentView
          - "Discovery/DiscoveryView.swift"      # iOS tab container
          - "Connection/ConnectedTab.swift"      # iOS tab container
    dependencies:
      - package: PeerDropKit
        product: PeerDropPlatform
      - package: PeerDropKit
        product: PeerDropCore
      - package: PeerDropKit
        product: PeerDropTransport
      - package: PeerDropKit
        product: PeerDropSecurity
      - package: PeerDropKit
        product: PeerDropProtocol
    settings:
      base:
        INFOPLIST_FILE: PeerDropMac/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hanfour.peerdrop.mac
        DEVELOPMENT_TEAM: UK48R5KWLV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PeerDropMac/App/PeerDrop-Mac.entitlements
        MARKETING_VERSION: "6.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SDKROOT: macosx
        ENABLE_HARDENED_RUNTIME: "YES"
      # NOTE deliberately NOT mirroring the iOS Release key-strip here:
      # DCAppAttestService is unavailable to this Mac target, so without
      # the bundled key a MAS build would have ZERO worker credential —
      # every relay route 401s (2026-07-05 review finding). Revisit
      # before the v6.0 Mac ship: either verify App Attest works on
      # macOS for this target, or keep the key Mac-only and accept that
      # a Mac IPA leaks it (rotate again if the Mac key ever burns).
  PeerDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeerDropTests
    dependencies:
      - target: PeerDrop
      - package: PeerDropKit
        product: PeerDropPlatform
      - package: PeerDropKit
        product: PeerDropCore
      - package: PeerDropKit
        product: PeerDropTransport
      - package: PeerDropKit
        product: PeerDropSecurity
      - package: PeerDropKit
        product: PeerDropProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerdrop.tests
        GENERATE_INFOPLIST_FILE: "YES"

  PeerDropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PeerDropUITests
    dependencies:
      - target: PeerDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerdrop.uitests
        GENERATE_INFOPLIST_FILE: "YES"

  PeerDropMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - PeerDropMacUITests
    dependencies:
      - target: PeerDropMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peerdrop.mac.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: UK48R5KWLV
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SDKROOT: macosx

schemes:
  PeerDrop:
    build:
      targets:
        PeerDrop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PeerDropTests
    profile:
      config: Release
    archive:
      config: Release

  PeerDropUITests:
    build:
      targets:
        PeerDrop: all
        PeerDropUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PeerDropUITests

  PeerDropMac:
    build:
      targets:
        PeerDropMac: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  PeerDropMacUITests:
    build:
      targets:
        PeerDropMac: all
        PeerDropMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PeerDropMacUITests
